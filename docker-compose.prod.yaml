# Production overrides for the VM. Use together with the base file:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
# (or simply: make prod-up)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Keep Postgres private: reachable only by the api container.
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging

  api:
    # Run the code baked into the image, not a bind mount of the checkout.
    volumes: !reset []
    # Not public: only Caddy talks to it, over the compose network.
    ports: !reset []
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn chatbot.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
